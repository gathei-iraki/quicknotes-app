<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <p class="eyebrow">Keep ideas close</p>
        <h1>QuickNotes</h1>
        <p>Capture the small things before they slip away.</p>
      </div>
    </header>

    <main>
      <section class="composer" aria-labelledby="add-note-heading">
        <h2 id="add-note-heading">Add a note</h2>
        <form id="note-form" novalidate>
          <div class="input-group">
            <label for="note-input">What do you want to remember?</label>
            <input
              id="note-input"
              name="note"
              type="text"
              maxlength="200"
              placeholder="Write a quick note…"
              autocomplete="off"
            >
          </div>

          <div class="category-group">
            <label for="note-category">Category</label>
            <select id="note-category" name="category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>

          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" role="alert" aria-live="polite"></p>
      </section>

      <section class="notes" aria-labelledby="notes-heading">
        <div class="notes-toolbar">
          <div>
            <p class="eyebrow">Your collection</p>
            <h2 id="notes-heading">Your notes</h2>
          </div>
          <label class="search-label" for="search-input">
            <span>Search notes</span>
            <input
              id="search-input"
              type="search"
              placeholder="Search…"
              autocomplete="off"
            >
          </label>
        </div>
        <p id="note-count" aria-live="polite">0 notes</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>QuickNotes · A calm place for busy thoughts.</p>
    </footer>
  </body>
</html>
